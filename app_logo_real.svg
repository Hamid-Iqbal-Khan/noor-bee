    <!-- 1. Luxurious Squircle Outer Frame with Premium Warm Golden Gradient -->
    <path fill="url(#outer_frame_grad)" d="M45,8 C115,1 115,1 155,8 C192,20 199,45 199,100 C199,155 192,180 155,192 C115,199 115,199 45,192 C8,180 1,155 1,100 C1,45 8,20 45,8 Z" />

    <!-- Outer Beveled Glowing Edge for the Squircle -->
    <path stroke="#FFFFFF" stroke-width="1.8" stroke-opacity="0.4" fill="none" d="M46,9 C114,2 114,2 154,9 C190,21 197,44 197,100 C197,156 190,179 154,191 C114,198 114,198 46,191 C10,179 3,156 3,100 C3,44 10,21 46,9 Z" />

    <!-- 2. Arabesque Sacred Honeycomb Geometry (Matt Gold Texture) -->
    <!-- Top-Left Corner 8-Pointed Star Medallion -->
    <path fill="#FFFFFF" fill-opacity="0.12" d="M28,28 L34,20 L40,28 L48,34 L40,40 L34,48 L28,40 L20,34 Z" />
    <path stroke="#FFFFFF" stroke-width="0.6" stroke-opacity="0.18" fill="none" d="M28,28 L40,40 M40,28 L28,40" />

    <!-- Top-Right Corner 8-Pointed Star Medallion -->
    <path fill="#FFFFFF" fill-opacity="0.12" d="M172,28 L178,20 L184,28 L192,34 L184,40 L178,48 L172,40 L164,34 Z" />
    <path stroke="#FFFFFF" stroke-width="0.6" stroke-opacity="0.18" fill="none" d="M172,28 L184,40 M184,28 L172,40" />

    <!-- Bottom-Left Background Star Pattern -->
    <path fill="#FFFFFF" fill-opacity="0.08" d="M24,166 L30,158 L36,166 L44,172 L36,178 L30,186 L24,178 L16,172 Z" />

    <!-- Bottom-Right Background Star Pattern -->
    <path fill="#FFFFFF" fill-opacity="0.08" d="M176,166 L182,158 L188,166 L196,172 L188,178 L182,186 L176,178 L168,172 Z" />

    <!-- Delicate Geometric Intersecting Framing Lines -->
    <path stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.1" fill="none" d="M34,20 L178,20 M20,34 L20,172 M192,34 L192,172 M30,186 L182,186" />

    <!-- 3. Symmetrical Curved Parchment Banners (The Symmetrical Left & Right Ribbons) -->
    <!-- Left Scroll Fold (Top) -->
    <path fill="url(#left_scroll_fold)" d="M60,22 C40,22 28,32 28,44 L28,48 C28,38 38,30 54,30 Z" />
    <!-- Left Main Scroll Banner Side (ENGLISH) -->
    <path fill="url(#left_scroll_banner)" d="M28,45 C14,52 14,75 22,105 C26,118 36,128 44,130 C48,131 48,124 44,123 C36,121 28,111 25,102 C18,78 18,58 30,52 Z" />

    <!-- Right Scroll Fold (Top - Symmetric) -->
    <path fill="url(#right_scroll_fold)" d="M140,22 C160,22 172,32 172,44 L172,48 C172,38 162,30 146,30 Z" />
    <!-- Right Main Scroll Banner Side (ARABIC) -->
    <path fill="url(#right_scroll_banner)" d="M172,45 C186,52 186,75 178,105 C174,118 164,128 156,130 C152,131 152,124 156,123 C164,121 172,111 175,102 C182,78 182,58 170,52 Z" />

    <!-- Beautiful Curved Shadows of Scroll Ribbons -->
    <path fill="#22000000" d="M24,53 Q34,60 30,102 Q26,110 24,103 Z M176,53 Q166,60 170,102 Q174,110 176,103 Z" />

    <!-- 4. Grand pointed Archway/Window revealing Celestial Night Sky -->
    <!-- Beautiful Beveled Golden Window Frame Base -->
    <path fill="url(#window_frame_grad)" d="M52,148 L52,72 C52,44 100,28 100,28 C100,28 148,44 148,72 L148,148 Z" />

    <!-- Inner Dark Arch displaying deep blue night/cosmos -->
    <path fill="url(#sky_grad)" d="M56,145 L56,74 C56,48 100,32 100,32 C100,32 144,48 144,74 L144,145 Z" />

    <!-- Soft radiant backlight glow inside the night sky -->
    <circle cx="100" cy="54" r="22" fill="#FFFFFF" fill-opacity="0.14" />

    <!-- Glowing Yellow Crescent Moon inside Arched Window -->
    <path fill="#FFFDE7" d="M100,42 C106.6,42 112,47.4 112,54 C112,60.6 106.6,66 100,66 C104.2,63 105.5,58.8 105.5,54 C105.5,49.2 104.2,45 100,42 Z" />

    <!-- Shimmering Star Constellations in Night Sky -->
    <path fill="#FFFFFF" d="M75,46 L76,48 L78,48 L76.5,49 L77,51 L75,50 L73,51 L73.5,49 L72,48 L74,48 Z" />
    <path fill="#FFFFFF" d="M125,48 L126,50 L128,50 L126.5,51 L127,53 L125,52 L123,53 L123.5,51 L122,50 L124,50 Z" />
    <path fill="#FFFFFF" fill-opacity="0.6" d="M100,36 L100.5,37.5 L102,37.5 L100.8,38.2 L101.2,39.7 L100,38.8 L98.8,39.7 L99.2,38.2 L98,37.5 L99.5,37.5 Z" />
    <circle cx="65" cy="65" r="0.8" fill="#FFFFFF" fill-opacity="0.7" />
    <circle cx="135" cy="65" r="0.8" fill="#FFFFFF" fill-opacity="0.7" />

    <!-- 5. Beautiful Stylized "NOOR BEE" Core Branding Inside the Window -->
    <!-- Glowing Outer Soft Drop Shadow for Noor Bee Calligraphy -->
    <ellipse cx="100" cy="82" rx="18" ry="8" fill="#FFD54F" fill-opacity="0.22" />

    <!-- Graphic "NOOR" Path Construction -->
    <!-- 'N' -->
    <path fill="#FFE082" stroke="#FFF8E1" stroke-width="0.3" d="M75,81 L75,75 L77,75 L80,79.5 L80,75 L81.5,75 L81.5,81 L79.5,81 L76.5,76.5 L76.5,81 Z" />
    <!-- 'O' (First) -->
    <path fill="#FFE082" stroke="#FFF8E1" stroke-width="0.3" d="M87.5,78 C87.5,79.8 86.2,81.2 84.5,81.2 C82.8,81.2 81.5,79.8 81.5,78 C81.5,76.2 82.8,74.8 84.5,74.8 C86.2,74.8 87.5,76.2 87.5,78 Z M83.5,78 C83.5,79.1 84,79.8 84.5,79.8 C85,79.8 85.5,79.1 85.5,78 C85.5,76.9 85,76.2 84.5,76.2 C84,76.2 83.5,76.9 83.5,78 Z" />
    <!-- 'O' (Second) -->
    <path fill="#FFE082" stroke="#FFF8E1" stroke-width="0.3" d="M94.5,78 C94.5,79.8 93.2,81.2 91.5,81.2 C89.8,81.2 88.5,79.8 88.5,78 C88.5,76.2 89.8,74.8 91.5,74.8 C93.2,74.8 94.5,76.2 94.5,78 Z M90.5,78 C90.5,79.1 91,79.8 91.5,79.8 C92,79.8 92.5,79.1 92.5,78 C92.5,76.9 92,76.2 91.5,76.2 C91,76.2 90.5,76.9 90.5,78 Z" />
    <!-- 'R' -->
    <path fill="#FFE082" stroke="#FFF8E1" stroke-width="0.3" d="M96.5,75 L100,75 C101.3,75 102.3,75.8 102.3,77 C102.3,77.8 101.7,78.5 100.8,78.7 L102.5,81 L100.5,81 L99,78.8 L98,78.8 L98,81 L96.5,81 Z M98,77.5 L99.5,77.5 C100,77.5 100.6,77.3 100.6,77 C100.6,76.7 100,76.5 99.5,76.5 L98,76.5 Z" />

    <!-- Graphic "BEE" Path Construction -->
    <!-- 'B' -->
    <path fill="#FFE082" stroke="#FFF8E1" stroke-width="0.3" d="M103.5,75 L107,75 C108.3,75 109.3,75.6 109.3,76.5 C109.3,77.2 108.7,77.7 107.8,77.9 C108.8,78.1 109.5,78.8 109.5,79.8 C109.5,80.7 108.3,81 107,81 L103.5,81 Z M105,77.2 L106.8,77.2 C107.5,77.2 107.8,76.9 107.8,76.6 C107.8,76.3 107.5,76.1 106.8,76.1 L105,76.1 Z M105,80 L106.8,80 C107.5,80 108,79.7 108,79.3 C108,78.9 107.5,78.6 106.8,78.6 L105,78.6 Z" />
    <!-- 'E' (First) -->
    <path fill="#FFE082" stroke="#FFF8E1" stroke-width="0.3" d="M111.5,75 L116.5,75 L116.5,76.2 L113,76.2 L113,77.5 L116,77.5 L116,78.7 L113,78.7 L113,79.8 L116.5,79.8 L116.5,81 L111.5,81 Z" />
    <!-- 'E' (Second) -->
    <path fill="#FFE082" stroke="#FFF8E1" stroke-width="0.3" d="M118.5,75 L123.5,75 L123.5,76.2 L120,76.2 L120,77.5 L123,77.5 L123,78.7 L120,78.7 L120,79.8 L123.5,79.8 L123.5,81 L118.5,81 Z" />

    <!-- Arabic Calligraphy "نوري" -->
    <!-- Main Noon-Waw loop base -->
    <path stroke="#FFD54F" stroke-width="1.8" stroke-linecap="round" fill="none" d="M78,92 C78,98 84,103 91,103 C96,103 101,100 101,96 C101,93 98,91 95,93 C92,95 91,98 87,98 C82,98 80,95 81,92" />
    <!-- Reh-Yeh elegant stroke swoop representing "ri" / "y" in Arabic -->
    <path stroke="#FFD54F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" d="M103,91 C106,94 110,99 116,99 C121,99 124,96 124,92 C124,88 120,86 117,89 C114,92 110,92 108,89" />
    <!-- Noon single dot over text -->
    <circle cx="89" cy="88" r="1.5" fill="#FFF59D" />
    <!-- Yeh double under dots at right -->
    <circle cx="111" cy="104" r="1" fill="#FFF59D" />
    <circle cx="115" cy="104" r="1" fill="#FFF59D" />

    <!-- 6. Playful English & Arabic letters styled beautifully on the scroll boundaries -->
    <!-- Left Ribbon Texts -->
    <!-- "ENGLISH" Label at the Top Fold -->
    <path fill="#4E342E" d="M35,60 L35,55 L36,55 L37.2,58.3 L38.4,55 L39.4,55 L39.4,60 L38.4,60 L38.4,56.5 L37.2,59.5 L36.2,59.5 L35,56.5 L35,60 Z" />
    <!-- "Abc..?!" at the Middle Fold -->
    <path stroke="#FF6F00" stroke-width="0.8" fill="none" d="M24,78 Q28,78 28,82 M26,81 L29,81" />
    <!-- "Rig" on the bottom curve -->
    <path stroke="#FF6F00" stroke-width="0.8" fill="none" d="M33,108 Q35,106 37,112" />

    <!-- Right Ribbon Texts -->
    <!-- "ARABIC" Label at the Top Fold -->
    <path fill="#4E342E" d="M165,60 L165,55 L166,55 L167.2,58.3 L168.4,55 L169.4,55 L169.4,60 L168.4,60 L168.4,56.5 L167.2,59.5 L166.2,59.5 L165,56.5 L165,60 Z" />
    <!-- "ا ب ت ؟" at the Middle Fold -->
    <path stroke="#FF6F00" stroke-width="0.8" fill="none" d="M176,78 Q172,78 172,82 M174,81 L171,81" />
    <!-- "ف-ز" on the bottom curve -->
    <path stroke="#FF6F00" stroke-width="0.8" fill="none" d="M167,108 Q165,106 163,112" />

    <!-- 7. Two Crossed Symmetrical Golden Writing Quill Feathers & Bronze Ink Pots -->
    <!-- Left Inkpot base -->
    <path fill="#3E2723" stroke="#FFC107" stroke-width="0.8" d="M56,146 L70,146 L68,138 L58,138 Z" />
    <!-- Left Inkpot glowing glass body -->
    <path fill="#0D47A1" fill-opacity="0.85" stroke="#82B1FF" stroke-width="0.6" d="M58,144 Q63,141 68,144 L67,146 L59,146 Z" />
    <!-- Symmetrical Right Inkpot Base -->
    <path fill="#3E2723" stroke="#FFC107" stroke-width="0.8" d="M130,146 L144,146 L142,138 L132,138 Z" />
    <!-- Right Inkpot glass body -->
    <path fill="#0D47A1" fill-opacity="0.85" stroke="#82B1FF" stroke-width="0.6" d="M132,144 Q137,141 142,144 L141,146 L133,146 Z" />

    <!-- Two Crossed Golden Writing Quill Feathers -->
    <path stroke="#FFD54F" stroke-width="1.2" fill="none" d="M60,140 C80,120 110,90 136,64" />
    <!-- Feather side barbs for Quill 1 -->
    <path stroke="#FFF8E1" stroke-width="0.5" fill="#FFD54F" d="M102,94 Q94,92 90,95 L95,101 Q104,101 107,98 Z M122,74 Q114,72 110,75 L115,81 Q124,81 127,78 Z" />

    <!-- Quill 2 -->
    <path stroke="#FFD54F" stroke-width="1.2" fill="none" d="M140,140 C120,120 90,90 64,64" />
    <!-- Feather side barbs for Quill 2 -->
    <path stroke="#FFF8E1" stroke-width="0.5" fill="#FFD54F" d="M98,94 Q106,92 110,95 L105,101 Q96,101 93,98 Z M78,74 Q86,72 90,75 L85,81 Q76,81 73,78 Z" />

    <!-- 8. Three Beautifully Styled, Stacked Bilingual Learning Books at bottom center -->
    <!-- Book 1 (Bottom Book - Royal Oceanic Blue) -->
    <path fill="url(#book1_grad)" d="M62,176 C80,180 120,180 138,176 L141,182 C120,186 80,186 59,182 Z" />
    <!-- Page layers (White) of Book 1 -->
    <path fill="#FFFFFF" stroke="#B0BEC5" stroke-width="0.5" d="M64,175 Q100,178 136,175 L136,179 Q100,182 64,179 Z" />

    <!-- Book 2 (Middle Book - Forest Leaves Green) -->
    <path fill="url(#book2_grad)" d="M65,168 C80,172 120,172 135,168 L138,174 C120,178 80,178 62,174 Z" />
    <!-- Page layers (White) of Book 2 -->
    <path fill="#FFFFFF" stroke="#B0BEC5" stroke-width="0.5" d="M67,167 Q100,170 133,167 L133,171 Q100,174 67,171 Z" />

    <!-- Book 3 (Top Book - Crimson Red) -->
    <path fill="url(#book3_grad)" d="M68,160 C80,164 120,164 132,160 L135,166 C120,170 80,170 65,166 Z" />
    <!-- Page layers (White) of Book 3 -->
    <path fill="#FFFFFF" stroke="#B0BEC5" stroke-width="0.5" d="M70,159 Q100,162 130,159 L130,163 Q100,166 70,163 Z" />

    <!-- Radiant Red / Gold Page ribbon bookmark -->
    <path fill="#E91E63" stroke="#880E4F" stroke-width="0.4" d="M98,161 L102,161 L103,184 L100,181 L97,184 Z" />
</svg>
