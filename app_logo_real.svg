            <stop offset="30%" stop-color="#FFD54F" />
            <stop offset="70%" stop-color="#FF8F00" />
            <stop offset="100%" stop-color="#4E342E" />
        </linearGradient>

        <linearGradient id="sky_grad" x1="100" y1="32" x2="100" y2="145" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#0B1D33" />
            <stop offset="40%" stop-color="#194867" />
            <stop offset="80%" stop-color="#2A6F97" />
            <stop offset="100%" stop-color="#071321" />
        </linearGradient>

        <linearGradient id="book1_grad" x1="59" y1="176" x2="141" y2="186" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#0D47A1" />
            <stop offset="50%" stop-color="#1E88E5" />
            <stop offset="100%" stop-color="#1565C0" />
        </linearGradient>

        <linearGradient id="book2_grad" x1="62" y1="168" x2="138" y2="178" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#1B5E20" />
            <stop offset="50%" stop-color="#4CAF50" />
            <stop offset="100%" stop-color="#2E7D32" />
        </linearGradient>

        <linearGradient id="book3_grad" x1="65" y1="160" x2="135" y2="170" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#B71C1C" />
            <stop offset="50%" stop-color="#E53935" />
            <stop offset="100%" stop-color="#C62828" />
