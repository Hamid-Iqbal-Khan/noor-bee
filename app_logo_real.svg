<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 200 200">
    <defs>
        <!-- Gradients from app_logo_real -->
        <linearGradient id="outer_frame_grad" x1="1" y1="1" x2="199" y2="199" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#FFEFA6" />
            <stop offset="40%" stop-color="#F5B838" />
            <stop offset="80%" stop-color="#D68616" />
            <stop offset="100%" stop-color="#A0550B" />
        </linearGradient>

        <linearGradient id="left_scroll_fold" x1="28" y1="22" x2="60" y2="48" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#BE8323" />
            <stop offset="100%" stop-color="#FFECB3" />
        </linearGradient>

        <linearGradient id="left_scroll_banner" x1="14" y1="45" x2="48" y2="130" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#FFF9E6" />
            <stop offset="60%" stop-color="#FCD275" />
            <stop offset="100%" stop-color="#D68616" />
        </linearGradient>

        <linearGradient id="right_scroll_fold" x1="172" y1="22" x2="140" y2="48" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#BE8323" />
            <stop offset="100%" stop-color="#FFECB3" />
        </linearGradient>

        <linearGradient id="right_scroll_banner" x1="186" y1="45" x2="152" y2="130" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#FFF9E6" />
            <stop offset="60%" stop-color="#FCD275" />
            <stop offset="100%" stop-color="#D68616" />
        </linearGradient>

        <linearGradient id="window_frame_grad" x1="100" y1="28" x2="100" y2="148" gradientUnits="userSpaceOnUse">
